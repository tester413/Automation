
<!DOCTYPE html>
<html>
<head>

<title>Automation Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f7fa;
padding:40px;
}

.card{
text-align:center;
padding:20px;
font-size:22px;
font-weight:bold;
}

.pass{
color:green;
font-weight:bold;
}

.fail{
color:red;
font-weight:bold;
}

.skip{
color:orange;
font-weight:bold;
}

table{
background:white;
}

</style>

</head>

<body>

<h1 class="mb-4">Playwright Automation Report</h1>

<div class="row mb-4">

<div class="col">
<div class="card bg-primary text-white">
Total<br>1
</div>
</div>

<div class="col">
<div class="card bg-success text-white">
Passed<br>1
</div>
</div>

<div class="col">
<div class="card bg-danger text-white">
Failed<br>0
</div>
</div>

<div class="col">
<div class="card bg-warning">
Skipped<br>0
</div>
</div>

</div>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Module</th>
<th>Scenario</th>
<th>Status</th>
<th>Duration</th>
<th>Browser</th>
<th>Spec File</th>

</tr>

</thead>

<tbody>


            <tr>
                <td>TC001</td>
                <td>Search</td>
                <td>Search Product</td>
                <td><span class='pass'>PASS</span></td>
                <td>17886 ms</td>
                <td>chromium</td>
                <td>search.spec.js</td>
            </tr>

</tbody>

</table>

</body>

</html>
